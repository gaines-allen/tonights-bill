# Re-pull runtimes, certifications, scores, posters and streaming availability.
#
# TMDB's availability data comes from JustWatch and refreshes once every 24
# hours, so running more often than daily buys nothing. Set TMDB_TOKEN (and
# optionally OMDB_KEY for real Rotten Tomatoes scores) in
# Settings -> Secrets and variables -> Actions.
name: Refresh catalog data

on:
  schedule:
    - cron: "20 11 * * *"     # 11:20 UTC daily, after JustWatch's push to TMDB
  workflow_dispatch:           # and on demand from the Actions tab
    inputs:
      args:
        description: "Extra args for the refresh (e.g. --probe, --no-discover)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enrich from TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::TMDB_TOKEN secret is not set — nothing to refresh."
            exit 1
          fi
          if [ "${{ inputs.args }}" = "--probe" ]; then
            node scripts/probe.mjs
            exit 0
          fi
          node scripts/enrich.mjs ${{ inputs.args }}

      - name: Verify the merge still holds
        run: |
          node scripts/enrich.test.mjs
          node scripts/merge.test.mjs
          node scripts/reveal.test.mjs
          node scripts/session.test.mjs
          node scripts/shelf.test.mjs
          node scripts/taste.test.mjs
          node scripts/search.test.mjs
          node scripts/tone.test.mjs

      # The three films behind the marquee. Chosen from tonight's catalog on
      # the first good refresh of a new month (America/Chicago), then only
      # re-checked: a film that has left every supported service is swapped
      # for the next eligible one. If anything above failed, this step never
      # runs and last month's set stays up. No extra secret: it reads only
      # data/catalog.json.
      - name: Choose or re-check the month's marquee films
        run: |
          node scripts/hero.mjs
          node scripts/hero.test.mjs

      # The scan shelves titles nobody has written a store line for, and a
      # shelved title can be the top pick. This says which ones arrived
      # tonight, on the run summary and in a committed worklist.
      - name: Flag shelved titles with no store line
        id: unwritten
        run: node scripts/unwritten.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first. On the very first run the file is untracked, and
          # `git diff` ignores untracked files — so comparing before staging
          # would report "no change" and silently throw the data away.
          git add data/catalog.json data/unwritten.json data/unwritten.md data/hero.json data/keywords.json
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi

          # Every run rewrites the generatedAt timestamp, so commit only when
          # something else moved. Deliberately NOT an allowlist of field names:
          # an allowlist silently discards any field added later, which is
          # exactly how a run of fresh synopses got thrown away once.
          CHANGED=$(git diff --cached -U0 -- data/catalog.json \
                    | grep -E '^[+-]' \
                    | grep -vE '^(\+\+\+|---)' \
                    | grep -vc '"generatedAt"' || true)
          # The worklist carries its own timestamp too, so it is compared the
          # same way: a run where nothing but the clocks moved commits nothing.
          WORK=$(git diff --cached -U0 -- data/unwritten.json data/unwritten.md \
                 | grep -E '^[+-]' \
                 | grep -vE '^(\+\+\+|---)' \
                 | grep -vc '"generatedAt"' || true)
          # hero.json carries no clock of its own: any diff is a real change.
          HERO=$(git diff --cached --name-only -- data/hero.json | wc -l | tr -d ' ')
          # keywords.json has no clock either: what the tags were built from.
          KW=$(git diff --cached --name-only -- data/keywords.json | wc -l | tr -d ' ')
          if [ "$CHANGED" -eq 0 ] && [ "$WORK" -eq 0 ] && [ "$HERO" -eq 0 ] && [ "$KW" -eq 0 ]; then
            echo "only the generated timestamps moved — skipping commit"
            git reset -q -- data/catalog.json data/unwritten.json data/unwritten.md data/hero.json data/keywords.json
            exit 0
          fi

          NEW="${{ steps.unwritten.outputs.new_count }}"
          MSG="Refresh catalog data from TMDB ($CHANGED field changes)"
          if [ -n "$NEW" ] && [ "$NEW" != "0" ]; then
            MSG="$MSG, $NEW newly shelved without a store line"
          fi
          if [ "$HERO" -ne 0 ]; then
            MSG="$MSG; marquee films updated"
          fi
          git commit -m "$MSG"
          git push
